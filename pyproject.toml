[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wplace-timelapse-serverless"
version = "0.1.0"
description = "Serverless capture workers and storage pipeline for the WPlace timelapse system."
authors = [
  { name = "WPlace Timelapse Contributors" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2.0",
  "pydantic>=2.8,<3.0",
  "requests>=2.31,<3.0",
  "typer>=0.12,<1.0",
  "python-dateutil>=2.9,<3.0",
  "Pillow",
  "workers-py",
  "fastapi"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.5.0,<0.6.0",
  "mypy>=1.10,<1.11",
  "python-dotenv>=1.0,<2.0"
]

[project.scripts]
wplace-capture = "wplace_timelapse_serverless.cli:main"
wplace-gallery = "wplace_timelapse_serverless.web_gallery.cli:main"
wplace-video = "wplace_timelapse_serverless.video.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
